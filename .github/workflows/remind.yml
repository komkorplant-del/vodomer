name: Напоминания

# Расписание отключено 06.09.2026: напоминания шлёт Cloudflare Worker по времени,
# которое считает сам телефон от последней записи. Здесь остался ручной запуск
# как запасной путь на случай, если воркер станет недоступен.
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Прислать проверочное уведомление сразу, не глядя на расписание'
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/send-push.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE_TEST: ${{ inputs.test }}
