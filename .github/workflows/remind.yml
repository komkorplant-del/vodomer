name: Напоминания

on:
  schedule:
    # Каждые полчаса в окне, покрывающем 07:00-23:00 по Киеву и летом, и зимой.
    # Слать или нет — решает скрипт по времени Киева, поэтому смена времени расписание не сдвигает.
    - cron: '0,30 4-20 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Прислать проверочное уведомление сразу, не глядя на расписание'
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/send-push.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE_TEST: ${{ inputs.test }}
